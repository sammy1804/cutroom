<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Cutroom motion archive: editable motion templates you can scrub, edit, sequence and export as MP4.">
<title>Cutroom Motion Archive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,300;9..144,600&family=Geist:wght@300;400;500;600;700;800&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: an archive — search and shelves across the top, large live previews dominate, a viewer opens over the shelf with stage, timeline and generated inspector. Light only, the Cutroom look. */
:root {
  color-scheme: light;
  --paper: #f6f6f4;
  --card: #ffffff;
  --sunk: #ecebe8;
  --ink: #121212;
  --muted: #6d6a65;
  --faint: #a7a39c;
  --line: #e2e0dc;
  --accent: #d6283e;
  --ui: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 15px/1.5 var(--ui); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--mono); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.wrap { max-width: 1440px; margin: 0 auto; padding-inline: 20px; padding-block: 0 72px; }

/* Header */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--paper) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1440px; margin: 0 auto; padding-inline: 20px; display: flex; align-items: center; gap: 16px; height: 60px; }
.mark { font: 800 18px var(--ui); letter-spacing: -.03em; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
.mark i { width: 12px; height: 12px; background: var(--accent); display: inline-block; }
.nav { display: flex; gap: 4px; }
.nav button { border: 0; background: none; padding: 6px 12px; border-radius: 999px; cursor: pointer; color: var(--muted); font-weight: 500; }
.nav button[aria-current="page"] { background: var(--ink); color: var(--paper); }
.search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 0 6px 0 14px; height: 40px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); padding: 8px 15px; border-radius: 999px; cursor: pointer; font-weight: 500; white-space: nowrap; font-size: 14px; }
.btn:hover { border-color: var(--faint); }
.btn.dark { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.btn.red { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.ghost { background: none; border-color: transparent; }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn[disabled] { opacity: .45; cursor: default; }
@media (max-width: 760px) { .bar { flex-wrap: wrap; height: auto; padding-block: 10px; } .search { order: 3; flex-basis: 100%; } }

/* Intro + shelves */
.intro { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: end; padding-block: 44px 26px; }
.intro h1 { font: 800 clamp(40px, 6.4vw, 92px)/.92 var(--ui); letter-spacing: -.045em; margin: 0; text-wrap: balance; }
.intro p { color: var(--muted); max-width: 52ch; margin: 0; font-size: 16px; }
@media (max-width: 860px) { .intro { grid-template-columns: 1fr; } }
.shelves { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
.shelves button { border: 1px solid var(--line); background: none; border-radius: 999px; padding: 6px 13px; cursor: pointer; white-space: nowrap; color: var(--muted); font-size: 14px; }
.shelves button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.shelves .count { font: 11px var(--mono); opacity: .7; margin-left: 4px; }
.answer { margin-top: 14px; color: var(--muted); font-size: 14px; }

/* Grid of objects */
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px 20px; margin-top: 22px; }
.grid.small { grid-template-columns: repeat(4, minmax(0, 1fr)); }
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } .grid.small { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) { .grid, .grid.small { grid-template-columns: 1fr; } }
.obj { text-align: left; background: none; border: 0; padding: 0; cursor: pointer; display: grid; gap: 10px; min-width: 0; }
.stage-sm { position: relative; aspect-ratio: 16 / 9; background: var(--sunk); overflow: hidden; }
.stage-sm canvas { width: 100%; height: 100%; display: block; }
.stage-sm .tag { position: absolute; left: 10px; top: 10px; font: 500 10px var(--mono); letter-spacing: .08em; text-transform: uppercase; background: rgba(255,255,255,.9); color: var(--ink); padding: 3px 7px; }
.stage-sm .len { position: absolute; right: 10px; bottom: 10px; font: 500 10px var(--mono); background: rgba(18,18,18,.78); color: #fff; padding: 3px 7px; }
.obj:hover .stage-sm, .obj:focus-visible .stage-sm { outline: 1px solid var(--ink); }
.obj .meta { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.obj h3 { font: 600 17px/1.25 var(--ui); letter-spacing: -.01em; margin: 0; }
.obj p { margin: 0; color: var(--muted); font-size: 14px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-top: 48px; border-top: 1px solid var(--ink); padding-top: 12px; }
.section-h h2 { font: 700 22px var(--ui); letter-spacing: -.02em; margin: 0; }
.empty { color: var(--muted); padding: 30px 0; }

/* Viewer */
.viewer { position: fixed; inset: 0; z-index: 20; background: var(--paper); display: grid; grid-template-rows: auto minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.vbar { display: flex; align-items: center; gap: 10px; padding: 12px 20px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.vbar h2 { font: 700 18px var(--ui); letter-spacing: -.02em; margin: 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vbody { display: grid; grid-template-columns: minmax(0, 1fr) 360px; min-height: 0; }
@media (max-width: 960px) { .vbody { grid-template-columns: 1fr; overflow-y: auto; } }
.stagewrap { display: grid; grid-template-rows: minmax(0, 1fr) auto; min-height: 0; padding: 20px; gap: 14px; }
.stage { display: grid; place-items: center; min-height: 280px; background: var(--sunk); overflow: hidden; }
.stage canvas { display: block; max-width: 100%; max-height: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.12); background: #fff; }
.timeline { display: grid; gap: 8px; }
.trow { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.time { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; min-width: 128px; }
.scrub { position: relative; height: 36px; flex: 1; min-width: 200px; cursor: pointer; touch-action: none; }
.scrub .rail { position: absolute; left: 0; right: 0; top: 16px; height: 4px; background: var(--line); }
.scrub .fill { position: absolute; left: 0; top: 16px; height: 4px; background: var(--ink); }
.scrub .head { position: absolute; top: 6px; width: 2px; height: 24px; background: var(--accent); transform: translateX(-1px); }
.scrub .mk { position: absolute; top: 0; height: 36px; border-left: 1px solid var(--faint); }
.scrub .mk span { position: absolute; top: -1px; left: 4px; font: 500 9px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--card); }
.seg button { border: 0; background: none; padding: 4px 10px; border-radius: 999px; cursor: pointer; font-size: 13px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.inspector { border-left: 1px solid var(--line); overflow-y: auto; padding: 18px 18px 40px; display: grid; gap: 20px; align-content: start; background: var(--card); }
@media (max-width: 960px) { .inspector { border-left: 0; border-top: 1px solid var(--line); } }
.group h4 { margin: 0 0 10px; font: 500 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.fields { display: grid; gap: 12px; }
label.f { display: grid; gap: 5px; }
label.f > span { font-size: 13px; font-weight: 500; display: flex; justify-content: space-between; gap: 8px; }
label.f > span em { font: 400 12px var(--mono); color: var(--muted); font-style: normal; }
.i { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 6px; padding: 8px 10px; min-width: 0; }
textarea.i { resize: vertical; min-height: 64px; }
input[type=range] { width: 100%; accent-color: var(--ink); }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; }
.colorf { display: grid; gap: 4px; font-size: 12px; color: var(--muted); }
.colorf .chip { position: relative; height: 34px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.colorf input { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.imgf { display: flex; align-items: center; gap: 10px; }
.imgf .th { width: 54px; height: 40px; background: var(--sunk) center / cover no-repeat; border: 1px solid var(--line); flex: none; }
.variants { display: flex; flex-wrap: wrap; gap: 6px; }
.variants button { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
.variants button[aria-pressed="true"] { border-color: var(--ink); background: var(--ink); color: var(--paper); }
.ai { display: grid; gap: 8px; background: var(--paper); border: 1px solid var(--line); padding: 12px; }
.ai p { margin: 0; font-size: 13px; color: var(--muted); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.note { font-size: 13px; color: var(--muted); }
.err { color: var(--accent); font-size: 13px; }

/* Board */
.board-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 16px; padding-block: 40px 20px; }
.board-head h1 { font: 800 clamp(36px, 5vw, 64px)/.95 var(--ui); letter-spacing: -.04em; margin: 0; }
.strip { display: flex; gap: 0; overflow-x: auto; padding-bottom: 10px; align-items: stretch; }
.bcard { width: 240px; flex: none; background: var(--card); border: 1px solid var(--line); display: grid; gap: 8px; padding: 10px; cursor: grab; }
.bcard.drag { opacity: .4; }
.bcard .stage-sm { aspect-ratio: 16 / 9; }
.bcard h3 { font: 600 14px var(--ui); margin: 0; }
.bcard .row { display: flex; gap: 4px; flex-wrap: wrap; }
.join { width: 92px; flex: none; display: grid; place-items: center; align-content: center; gap: 4px; padding: 6px; }
.join select { width: 84px; font-size: 12px; padding: 4px; border: 1px solid var(--line); background: var(--card); border-radius: 4px; }
.join::before { content: ""; display: block; width: 100%; height: 1px; background: var(--ink); }
.boardplay { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; margin-top: 24px; }
@media (max-width: 960px) { .boardplay { grid-template-columns: 1fr; } }
.toast { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); }
.progress { height: 4px; background: var(--line); }
.progress i { display: block; height: 100%; background: var(--accent); }
@media (max-width: 640px) { .scrub .mk span { display: none; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
</head>
<body>

<header class="top"><div class="bar">
  <span class="mark"><i></i>Cutroom</span>
  <nav class="nav" aria-label="Sections"><button id="nav-lib" data-act="go" data-to="library" aria-current="page">Library</button><button id="nav-board" data-act="go" data-to="board">Board <span id="board-count" class="mono"></span></button></nav>
  <form class="search" id="search" role="search"><input id="q" placeholder="Search, or describe what you need: “something tactile for a product”" aria-label="Search the archive"><button class="btn sm dark" id="ask-btn" type="submit">Find</button></form>
</div></header>
<main class="wrap" id="main"></main>
<div class="viewer" id="viewer" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
/* ════════════════════════ Cutroom motion language ════════════════════════
   Every object is a pure function render(ctx, t, P, W, H): seekable to any time,
   aspect-aware, editable through declared properties. Shared primitives below. */
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const seg = (t, a, d) => clamp((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const E = {
  out: (x) => (x >= 1 ? 1 : 1 - Math.pow(2, -10 * x)),             // Cutroom out: fast start, long settle
  inOut: (x) => (x < 0.5 ? 8 * x ** 4 : 1 - Math.pow(-2 * x + 2, 4) / 2),
  soft: (x) => 1 - Math.pow(1 - x, 3),
  in: (x) => x * x * x,
  back: (x) => { const c = 1.35; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); },
};
const hash = (s) => { let h = 2166136261; for (const c of String(s)) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
const rng = (seed) => { let s = hash(seed) || 1; return () => { s ^= s << 13; s ^= s >>> 17; s ^= s << 5; return ((s >>> 0) % 100000) / 100000; }; };
const FAM = {
  sans: '"Geist", ui-sans-serif, system-ui, sans-serif',
  serif: '"Instrument Serif", Georgia, "Times New Roman", serif',
  fraunces: '"Fraunces", Georgia, serif',
  condensed: '"Anton", Impact, "Arial Narrow", sans-serif',
  mono: '"Geist Mono", ui-monospace, Menlo, monospace',
};
const font = (w, size, fam = "sans", italic = false) => `${italic ? "italic " : ""}${w} ${Math.max(1, size)}px ${FAM[fam] || FAM.sans}`;
const hexToRgb = (h) => { const m = String(h).replace("#", ""); const n = parseInt(m.length === 3 ? m.split("").map((c) => c + c).join("") : m, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
const mix = (a, b, k) => { const x = hexToRgb(a), y = hexToRgb(b); return `rgb(${x.map((v, i) => Math.round(lerp(v, y[i], k))).join(",")})`; };
const alpha = (h, a) => { const [r, g, b] = hexToRgb(h); return `rgba(${r},${g},${b},${a})`; };
const lines = (s) => String(s || "").split("\n").map((x) => x.trim()).filter(Boolean);

function wrap(ctx, text, maxW) {
  const out = [];
  for (const para of String(text).split("\n")) {
    let cur = "";
    for (const w of para.split(/\s+/).filter(Boolean)) {
      const test = cur ? cur + " " + w : w;
      if (ctx.measureText(test).width > maxW && cur) { out.push(cur); cur = w; } else cur = test;
    }
    out.push(cur);
  }
  return out;
}
/** Fit a font size so the longest wrapped line spans at most maxW in at most maxLines lines. */
function fitSize(ctx, text, maxW, maxLines, start, w, fam) {
  let size = start;
  for (let i = 0; i < 30; i++) { ctx.font = font(w, size, fam); if (wrap(ctx, text, maxW).length <= maxLines) break; size *= 0.92; }
  return size;
}
/** Mask reveal: each line slides up out of its own clip box. */
function revealLines(ctx, ls, x, y, size, lh, t, start, stagger, dur, align = "left", out = null) {
  ls.forEach((ln, i) => {
    const p = E.out(seg(t, start + i * stagger, dur));
    if (p <= 0) return;
    const q = out ? E.in(seg(t, out + i * stagger * 0.5, dur * 0.7)) : 0;
    const w = ctx.measureText(ln).width;
    const lx = align === "center" ? x - w / 2 : align === "right" ? x - w : x;
    const ly = y + i * lh;
    ctx.save();
    ctx.beginPath(); ctx.rect(lx - size * 0.2, ly - size * 1.02, w + size * 0.4, size * 1.32); ctx.clip();
    ctx.fillText(ln, lx, ly + (1 - p) * size * 1.15 - q * size * 1.15);
    ctx.restore();
  });
}
function charReveal(ctx, text, x, y, size, t, start, stagger, dur, align = "left") {
  const w = ctx.measureText(text).width;
  let cx = align === "center" ? x - w / 2 : x;
  [...text].forEach((ch, i) => {
    const p = E.out(seg(t, start + i * stagger, dur));
    const cw = ctx.measureText(ch).width;
    ctx.save(); ctx.globalAlpha *= p; ctx.fillText(ch, cx, y + (1 - p) * size * 0.45); ctx.restore();
    cx += cw;
  });
}
function cover(ctx, img, x, y, w, h, zoom = 1, px = 0, py = 0) {
  const r = Math.max(w / img.width, h / img.height) * zoom;
  const iw = img.width * r, ih = img.height * r;
  ctx.drawImage(img, x + (w - iw) / 2 + px * w, y + (h - ih) / 2 + py * h, iw, ih);
}
/** A stand-in photograph: architectural light and shadow, art-directed, never stock. Replace with an image. */
function plate(ctx, x, y, w, h, seed, tone = "#c9c4bb", zoom = 1) {
  const r = rng(seed);
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.translate(x + w / 2, y + h / 2); ctx.scale(zoom, zoom); ctx.translate(-(x + w / 2), -(y + h / 2));
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, mix(tone, "#ffffff", 0.55)); g.addColorStop(1, mix(tone, "#ffffff", 0.15));
  ctx.fillStyle = g; ctx.fillRect(x - w, y - h, w * 3, h * 3);
  const n = 3 + Math.floor(r() * 3);
  for (let i = 0; i < n; i++) {
    const bx = x + (i / n) * w * 1.1 - w * 0.05 + r() * w * 0.08, bw = w * (0.18 + r() * 0.22), top = y + h * (0.15 + r() * 0.45);
    ctx.fillStyle = mix(tone, "#111111", 0.25 + r() * 0.35);
    ctx.fillRect(bx, top, bw, h);
    ctx.fillStyle = mix(tone, "#ffffff", 0.35);
    ctx.fillRect(bx, top, bw * (0.25 + r() * 0.2), h);
    ctx.fillStyle = alpha("#000000", 0.12);
    for (let k = 0; k < 6; k++) ctx.fillRect(bx + bw * 0.35, top + h * 0.06 + k * h * 0.07, bw * 0.5, h * 0.012);
  }
  ctx.fillStyle = alpha("#000000", 0.18);
  ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x + w * 0.62, y + h * 0.58); ctx.lineTo(x + w, y + h * 0.66); ctx.lineTo(x + w, y + h); ctx.fill();
  ctx.restore();
}
function image(ctx, key, P) { const v = P[key]; return v && IMAGES.get(v) || null; }
/** Hand-torn edge path along a line, seeded so the same paper tears the same way every frame. */
function tornRect(ctx, x, y, w, h, seed, amp) {
  const r = rng(seed);
  const steps = Math.max(8, Math.round(w / 8)), vs = Math.max(4, Math.round(h / 8));
  ctx.beginPath(); ctx.moveTo(x, y + r() * amp);
  for (let i = 1; i <= steps; i++) ctx.lineTo(x + (w * i) / steps, y + (r() - 0.5) * amp);
  for (let i = 1; i <= vs; i++) ctx.lineTo(x + w + (r() - 0.5) * amp * 0.6, y + (h * i) / vs);
  for (let i = steps - 1; i >= 0; i--) ctx.lineTo(x + (w * i) / steps, y + h + (r() - 0.5) * amp);
  for (let i = vs - 1; i > 0; i--) ctx.lineTo(x + (r() - 0.5) * amp * 0.6, y + (h * i) / vs);
  ctx.closePath();
}
const stepTime = (t, fps) => Math.floor(t * fps) / fps;
/** Stop-motion boil: a tiny offset and rotation that changes once per drawing. */
const boil = (seed, step, amt) => { const r = rng(seed + ":" + step); return { x: (r() - 0.5) * 2 * amt, y: (r() - 0.5) * 2 * amt, a: (r() - 0.5) * amt * 0.012 }; };
const ui = (W, H) => Math.min(W, H) / 100;   // one layout unit
const isTall = (W, H) => H > W * 1.05;

/* ════════════════════════ Objects ════════════════════════ */
const C = (key, label, def, group = "look") => ({ key, label, type: "color", default: def, group });
const T = (key, label, def, max) => ({ key, label, type: "text", default: def, max });
const LT = (key, label, def) => ({ key, label, type: "longText", default: def });
const N = (key, label, def, min, max, step = 0.05, group = "motion") => ({ key, label, type: "number", default: def, min, max, step, group });
const SEL = (key, label, def, options, group = "look") => ({ key, label, type: "select", default: def, options, group });
const IMG = (key, label) => ({ key, label, type: "image", default: null });
const SPEED = N("speed", "Pace", 1, 0.6, 1.6);
const INTENSITY = N("intensity", "Motion intensity", 1, 0.3, 1.5);
const DISPLAY = SEL("display", "Display type", "sans", ["sans", "serif", "condensed", "fraunces"]);

/* ── 01 Minimal Product Launch ─────────────────────────────────── */
function drawProduct(ctx, cx, cy, h, P, sweep) {
  const img = image(ctx, "productImage", P);
  const w = h * 0.44, r = w / 2;

  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 60_000);
  toast("Downloaded " + filename);
}

/* ════════════════════════ Actions ════════════════════════ */
const act = {
  go(el) { S.view = el.dataset.to; boardPlay.playing = false; render(); window.scrollTo({ top: 0 }); },
  shelf(el) { S.shelf = el.dataset.shelf; S.aiIds = null; render(); },
  clearAi() { S.aiIds = null; S.q = ""; document.getElementById("q").value = ""; render(); },
  open(el) { openObject(OBJECTS.find((o) => o.id === el.dataset.id)); },
  openSaved(el) { const it = S.saved.find((x) => x.id === el.dataset.id); openObject(OBJECTS.find((o) => o.id === it.objectId), { variant: it.variant, aspect: it.aspect, edits: it.props, savedId: it.id }); },
  close() { closeViewer(); },
  play() { V.playing = !V.playing; V.last = 0; const b = document.getElementById("playbtn"); if (b) { b.textContent = V.playing ? "Pause" : "Play"; b.setAttribute("aria-label", b.textContent); } },
  step(el) { V.playing = false; V.t = Math.max(0, V.t + +el.dataset.d / 30); const b = document.getElementById("playbtn"); if (b) b.textContent = "Play"; },
  aspect(el) { V.aspect = el.dataset.aspect; renderViewer(); },
  variant(el) { V.variant = el.dataset.v; renderViewer(); },
  reset() { V.edits = {}; renderViewer(); },
  clearImage(el) { delete V.edits[el.dataset.key]; renderViewer(); },
  addBoard() { S.board.items.push({ id: uidv("b"), objectId: V.o.id, variant: V.variant, props: clone(V.edits) }); if (S.board.items.length > 1) S.board.joins[S.board.items.length - 2] ||= "Cut"; persist(); updateCount(); toast("Added to board · " + S.board.items.length + " pieces"); },
  updateBoard() { const it = S.board.items[V.boardIndex]; if (it) { it.variant = V.variant; it.props = clone(V.edits); persist(); toast("Board updated"); } closeViewer(); },
  saveVersion() {
    if (V.savedId) { const it = S.saved.find((x) => x.id === V.savedId); Object.assign(it, { variant: V.variant, aspect: V.aspect, props: clone(V.edits) }); }
    else { const it = { id: uidv("v"), objectId: V.o.id, variant: V.variant, aspect: V.aspect, props: clone(V.edits), name: (V.edits.headline || V.edits.title || V.edits.productName || V.o.name).toString().slice(0, 40) }; S.saved.unshift(it); V.savedId = it.id; }
    persist(); toast("Saved to your archive");
  },
  exportOne() { const o = V.o, P = VP(); V.playing = false; exportVideo((ctx, t, W, H) => drawFrame(ctx, o, P, t, W, H), durationOf(o, P), V.aspect, P.headline || P.title || o.name, "exp-note"); },
  editBoard(el) { const i = +el.dataset.i, it = S.board.items[i]; openObject(OBJECTS.find((o) => o.id === it.objectId), { variant: it.variant, aspect: S.board.aspect, edits: it.props, boardIndex: i }); },
  dupBoard(el) { const i = +el.dataset.i; S.board.items.splice(i + 1, 0, { ...clone(S.board.items[i]), id: uidv("b") }); S.board.joins.splice(i, 0, "Cut"); persist(); render(); },
  delBoard(el) { const i = +el.dataset.i; S.board.items.splice(i, 1); S.board.joins.splice(Math.max(0, i - 1), 1); persist(); render(); },
  boardAspect(el) { S.board.aspect = el.dataset.aspect; persist(); render(); },
  boardPlay() { boardPlay.playing = !boardPlay.playing; boardPlay.last = 0; render(); if (boardPlay.playing) boardPlay.raf = requestAnimationFrame(boardTick); },
  exportBoard() { boardPlay.playing = false; const scratch = document.createElement("canvas"); exportVideo((ctx, t, W, H) => renderBoardFrame(ctx, t, W, H, scratch), boardDuration(), S.board.aspect, "cutroom-board", "bexp-note"); },
};
document.addEventListener("click", (e) => { const el = e.target.closest("[data-act]"); if (!el || el.disabled) return; const fn = act[el.dataset.act]; if (fn) { e.preventDefault(); fn(el); } });
main.addEventListener("change", (e) => { const j = e.target.closest("[data-join]"); if (j) { S.board.joins[+j.dataset.join] = j.value; persist(); } });
main.addEventListener("input", (e) => { if (e.target.id === "board-notes") { S.board.notes = e.target.value; persist(); } });
// Drag to reorder the board
let dragFrom = null;
main.addEventListener("dragstart", (e) => { const c = e.target.closest("[data-drag]"); if (!c) return; dragFrom = +c.dataset.drag; c.classList.add("drag"); e.dataTransfer.effectAllowed = "move"; });
main.addEventListener("dragend", (e) => e.target.closest("[data-drag]")?.classList.remove("drag"));
main.addEventListener("dragover", (e) => { if (dragFrom != null && e.target.closest("[data-drag]")) e.preventDefault(); });
main.addEventListener("drop", (e) => { const c = e.target.closest("[data-drag]"); if (!c || dragFrom == null) return; e.preventDefault(); const to = +c.dataset.drag; const [m] = S.board.items.splice(dragFrom, 1); S.board.items.splice(to, 0, m); dragFrom = null; persist(); render(); });

// Search: words filter instantly; a described need asks Claude to pick from the archive.
document.getElementById("q").addEventListener("input", (e) => { S.q = e.target.value; S.aiIds = null; if (S.view === "library") render(); });
document.getElementById("search").addEventListener("submit", async (e) => {
  e.preventDefault();
  const q = S.q.trim(); if (!q) return;
  if (S.view !== "library") { S.view = "library"; }
  if (!cap.sample || q.split(/\s+/).length < 3) { render(); return; }
  const btn = document.getElementById("ask-btn"); btn.disabled = true; btn.textContent = "Finding…";
  try {
    const catalog = OBJECTS.map((o) => ({ id: o.id, name: o.name, type: o.type, category: o.category, tags: o.tags, description: o.description }));
    const res = await cap.sample.json(`You are the librarian of a curated motion-design archive. Pick the pieces that best fit this need, best first, up to 6, and skip anything that doesn't fit. Prefer restraint over gimmicks.\nNeed: ${q}\nArchive (JSON): ${JSON.stringify(catalog)}\nReply with only JSON: {"ids":["id"],"note":"one sentence on why these, written to the person"}`, { modelTier: "quick" });
    const ids = (res?.ids || []).filter((id) => OBJECTS.some((o) => o.id === id));
    S.aiIds = ids; S.aiNote = res?.note || "Closest matches.";
  } catch (err) { S.aiIds = null; toast(err?.code === "not_granted" ? "Allow Claude for this page to search by description." : "Couldn't ask Claude. Showing word matches."); }
  btn.disabled = false; btn.textContent = "Find"; render();
});

function updateCount() { document.getElementById("board-count").textContent = S.board.items.length ? S.board.items.length : ""; }
function render() {
  document.getElementById("nav-lib").setAttribute("aria-current", S.view === "library" ? "page" : "false");
  document.getElementById("nav-board").setAttribute("aria-current", S.view === "board" ? "page" : "false");
  main.innerHTML = S.view === "library" ? libraryView() : boardView();
  updateCount();
  requestAnimationFrame(() => (S.view === "library" ? paintPosters() : paintBoard()));
}
window.addEventListener("resize", () => { clearTimeout(render.r); render.r = setTimeout(() => (S.view === "library" ? paintPosters() : paintBoard()), 150); });

(async function start() {
  render();
  const fontsReady = Promise.all(["Geist", "Instrument Serif", "Anton", "Fraunces", "Geist Mono"].map((f) => document.fonts.load(`40px "${f}"`).catch(() => null)));
  const c = window.claude;
  if (c?.use) {
    const [db, user, sample, assets, downloads] = await Promise.all(["db", "user", "sample", "assets", "downloads"].map((n) => c.use(n).catch(() => null)));
    cap = { db, uid: user ? await user.id().catch(() => null) : null, sample, assets, downloads };
  }
  await Promise.all([fontsReady, restore()]);
  render();
})();
</script>
</body>
</html>
